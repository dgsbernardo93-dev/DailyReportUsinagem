name: Gerar APK Daily Report

on:
  workflow_dispatch:
  push:
    paths:
      - '*.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar arquivos do repositório
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Extrair projeto Android
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -type f -iname '*.zip' | head -n 1)
          test -n "$ZIP_FILE"
          mkdir -p android-project
          unzip -o "$ZIP_FILE" -d android-project
          test -f android-project/settings.gradle

      - name: Compilar APK
        run: cd android-project && gradle assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: DailyReport-Usinagem-APK
          path: android-project/app/build/outputs/apk/debug/app-debug.apk
