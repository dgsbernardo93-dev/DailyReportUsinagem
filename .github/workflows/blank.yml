
name: Gerar APK Daily Report

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Extrair e localizar projeto
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -type f -iname '*.zip' | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            mkdir -p projeto-extraido
            unzip -o "$ZIP_FILE" -d projeto-extraido
          fi

          SETTINGS=$(find . -type f \( -name settings.gradle -o -name settings.gradle.kts \) | head -n 1)
          if [ -z "$SETTINGS" ]; then
            echo "ERRO: settings.gradle não encontrado dentro do ZIP."
            exit 1
          fi

          echo "PROJECT_DIR=$(dirname "$SETTINGS")" >> "$GITHUB_ENV"

      - name: Compilar APK
        run: cd "$PROJECT_DIR" && gradle assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: DailyReport-Usinagem-APK
          path: '**/app/build/outputs/apk/debug/app-debug.apk'
          if-no-files-found: error
